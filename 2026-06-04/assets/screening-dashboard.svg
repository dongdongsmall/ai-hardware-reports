<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">2026-06-04 AI hardware screening dashboard</title>
  <desc id="desc">Past 24 hour screening summary for finished end-user AI hardware products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7faf7"/>
      <stop offset="0.55" stop-color="#eef6f7"/>
      <stop offset="1" stop-color="#fbf4e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#233847" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1160" height="520" rx="8" fill="url(#bg)"/>
  <text x="44" y="64" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700">过去 24 小时筛选结果</text>
  <text x="44" y="96" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">窗口：2026-06-03 13:01 - 2026-06-04 13:10 CST；只保留成品硬件、最终用户、AI 能力明确的发布 / 开售 / 发货 / 实证节点。</text>

  <g filter="url(#shadow)">
    <rect x="44" y="132" width="250" height="126" rx="8" fill="#ffffff" stroke="#d8e0e6"/>
    <text x="68" y="178" fill="#245f79" font-family="Arial, 'PingFang SC', sans-serif" font-size="44" font-weight="700">2</text>
    <text x="68" y="210" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">个人消费者</text>
    <text x="68" y="234" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">发货 / 渠道开售</text>

    <rect x="324" y="132" width="250" height="126" rx="8" fill="#ffffff" stroke="#d8e0e6"/>
    <text x="348" y="178" fill="#a84a42" font-family="Arial, 'PingFang SC', sans-serif" font-size="44" font-weight="700">0</text>
    <text x="348" y="210" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">家庭消费者</text>
    <text x="348" y="234" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">无高置信新品</text>

    <rect x="604" y="132" width="250" height="126" rx="8" fill="#ffffff" stroke="#d8e0e6"/>
    <text x="628" y="178" fill="#3f7459" font-family="Arial, 'PingFang SC', sans-serif" font-size="44" font-weight="700">2</text>
    <text x="628" y="210" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">企业消费者</text>
    <text x="628" y="234" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">展示 / 实证节点</text>

    <rect x="884" y="132" width="232" height="126" rx="8" fill="#ffffff" stroke="#d8e0e6"/>
    <text x="908" y="178" fill="#9a6a22" font-family="Arial, 'PingFang SC', sans-serif" font-size="44" font-weight="700">9</text>
    <text x="908" y="210" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">排除 / 观察项</text>
    <text x="908" y="234" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">芯片、平台、传闻、过窗</text>
