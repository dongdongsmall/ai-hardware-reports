  <g transform="translate(44 304)">
    <rect width="1072" height="154" rx="8" fill="#ffffff" stroke="#d8e0e6"/>
    <text x="24" y="38" fill="#17202a" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700">今天的主线</text>
    <text x="24" y="72" fill="#34424c" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">消费侧是 Oura Ring 5 从预订进入常规销售和首批发货，以及 Meta AI 眼镜在日本授权线上渠道开售。</text>
    <text x="24" y="104" fill="#34424c" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">企业侧主要来自实体机器人公开展示与铁路 / 工业实证，而不是已经进入大规模零售的终端。</text>
    <text x="24" y="136" fill="#60717d" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">因此本期把“已开售 / 已发货”和“公开展示 / 实证”分层标注，避免把原型、部件或纯平台方案混入主清单。</text>
